<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML FORMS</title>
    </head>
    <body>
        <form>
            <input type="text" placeholder="input your first name">
            <input type="text" placeholder="input your last name">
            <input type="number" placeholder="your girlfriend's phone number">
            <input type="date">
            <input type="datetime-local">
            <input type="email" placeholder="example@gmail.com"><br>
            <input type="checkbox">
            <input type="button">
            <input type="radio"><br>
            <h3>Who was the first to be in class today?</h3>
            <input type="checkbox" name="first"> Mr Amala
            <input type="checkbox" name="first"> Mr Ewedu
            <input type="checkbox" name="first"> Mrs Ponmo
            <input type="checkbox" name="first"> Mrs Fish
            <input type="checkbox" name="first"> Tinubu
            <h3>Who was the last person to join the class</h3>
            <input type="radio" name="last"> Mr Amala
            <input type="radio" name="last"> Mr Ewedu
            <input type="radio" name="last"> Mrs Ponmo
            <input type="radio" name="last"> Mrs Fish
            <input type="radio" name="first"> Tinubu
            
            <br>
            <hr>
            <select>
                <option value="">Select Your State</option>
                <option value="">Ondo State</option>
                <option value="">Osun State</option>
                <option value="">Lagos State</option>
                <option value="">Imo State</option>
                <option value="">Ogun State</option>
                <option value="">Ekiti State</option>
                <option value="">Oyo State</option>
                <option value="">Anambra State</option>
            </select>
            <!--the name allows us to be able to choose only one at a time when they have they same name but when they have different name you cannot choose multiple at a time for radio-->
        </form>
    </body>
</html>
